<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Finder</title>
<style>
/* Layout: one narrow column. Search bar on top, extension chips under it, results as a ledger of rows. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#14201c; --muted:#5d6b66; --line:#d9dfdc;
  --accent:#0b6b55; --accent-ink:#ffffff;
  --ok:#0a7a3d; --ok-bg:#e2f4e9; --no:#a23a2a; --no-bg:#f8e6e2; --wait:#6a6f2a; --wait-bg:#f1f0d8;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1614; --panel:#17211e; --ink:#e7efeb; --muted:#93a39d; --line:#2a3833;
    --accent:#3fc29d; --accent-ink:#06241b;
    --ok:#5fd992; --ok-bg:#12331f; --no:#f0907f; --no-bg:#3a1b16; --wait:#d5d77a; --wait-bg:#2f3015;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding:40px 16px 64px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
form{display:flex;gap:8px;flex-wrap:wrap}
#q{flex:1 1 240px;min-width:0;font:18px var(--mono);padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
#q:focus-visible,button:focus-visible,a:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#go{font:600 16px var(--sans);padding:0 22px;min-height:52px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#go:disabled{opacity:.6;cursor:progress}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:14px var(--mono);padding:6px 11px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
#summary{font-size:14px;color:var(--muted);min-height:21px}
#results{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#results:empty{display:none}
#results li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line)}
#results li:first-child{border-top:0}
.name{flex:1 1 200px;min-width:0;font:16px var(--mono);overflow-wrap:anywhere}
.name b{font-weight:400;color:var(--muted)}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ok{color:var(--ok);background:var(--ok-bg)} .no{color:var(--no);background:var(--no-bg)} .wait{color:var(--wait);background:var(--wait-bg)}
.acts{display:flex;gap:12px;font-size:13px}
.acts a,.acts button{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
li.taken .name{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <header>
    <h1>Domain Finder</h1>
    <p class="sub">Type a name and check it across extensions in one go.</p>
  </header>

  <form id="f" autocomplete="off">
    <input id="q" type="text" placeholder="yourbrand" aria-label="Domain name" spellcheck="false" autocapitalize="off" autofocus>
    <button id="go" type="submit">Search</button>
  </form>

  <section>
    <p class="label">Extensions</p>
    <div class="chips" id="chips"></div>
  </section>

  <div class="opts">
    <label><input type="checkbox" id="vars"> Include name variations</label>
    <label><input type="checkbox" id="onlyfree"> Show available only</label>
    <button type="button" id="all">Select all</button>
    <button type="button" id="none">Clear</button>
  </div>

  <div id="summary" aria-live="polite"></div>
  <ul id="results"></ul>

  <p class="note">Results come from live DNS and registry lookups. "Available" means no registration was found. Confirm with your registrar before you buy, since a small number of registered names have no DNS records.</p>
</main>

<script>
const TLDS = ["co.za","com","africa","net","org","digital","agency","io","co","online","store","tech","app","dev","ai","org.za","net.za","web.za","joburg","capetown","durban"];
const DEFAULT_ON = ["co.za","com","africa","net","org","digital"];
const PREFIX = ["get","my","the","try"], SUFFIX = ["hq","online","sa","group","digital"];

const $ = id => document.getElementById(id);
const chips = $("chips"), results = $("results"), summary = $("summary");
let selected = new Set(DEFAULT_ON), runId = 0;

try { const s = JSON.parse(localStorage.getItem("df_tlds")); if (Array.isArray(s) && s.length) selected = new Set(s.filter(t => TLDS.includes(t))); } catch (e) {}
const save = () => { try { localStorage.setItem("df_tlds", JSON.stringify([...selected])); } catch (e) {} };

function drawChips(){
  chips.innerHTML = "";
  TLDS.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = "." + t;
    b.setAttribute("aria-pressed", selected.has(t));
    b.onclick = () => { selected.has(t) ? selected.delete(t) : selected.add(t); save(); drawChips(); };
    chips.appendChild(b);
  });
}
drawChips();
$("all").onclick = () => { selected = new Set(TLDS); save(); drawChips(); };
$("none").onclick = () => { selected = new Set(); save(); drawChips(); };
$("onlyfree").onchange = applyFilter;

function applyFilter(){
  const only = $("onlyfree").checked;
  results.querySelectorAll("li").forEach(li => li.hidden = only && li.classList.contains("taken"));
}

// Split what was typed into a label and an optional extension the user included.
function parse(raw){
  let s = raw.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").split("/")[0];
  let typed = null;
  const hit = [...TLDS].sort((a, b) => b.length - a.length).find(t => s.endsWith("." + t));
  if (hit) { typed = hit; s = s.slice(0, -hit.length - 1); }
  else if (s.includes(".")) { const i = s.indexOf("."); typed = s.slice(i + 1).replace(/[^a-z0-9.-]/g, ""); s = s.slice(0, i); }
  const label = s.replace(/[\s_]+/g, "-").replace(/[^a-z0-9-]/g, "").replace(/^-+|-+$/g, "").slice(0, 63);
  return { label, typed };
}

async function doh(domain){
  const urls = [
    "https://dns.google/resolve?name=" + encodeURIComponent(domain) + "&type=NS",
    "https://cloudflare-dns.com/dns-query?name=" + encodeURIComponent(domain) + "&type=NS"
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { headers: { accept: "application/dns-json" } });
      if (!r.ok) continue;
      const j = await r.json();
      if (j.Status === 3) return "free";
      if (j.Status === 0) return "taken";
    } catch (e) {}
  }
  return "unknown";
}

// Registry record lookup. 404 means no registration exists. Not every registry allows browser lookups.
async function rdap(domain){
  try {
    const r = await fetch("https://rdap.org/domain/" + encodeURIComponent(domain));
    // A 404 only counts when a real registry answered. rdap.org itself returns 404 for extensions it does not cover (such as .co.za).
    if (r.status === 404) return new URL(r.url).hostname.endsWith("rdap.org") ? "unknown" : "free";
    if (r.ok) return "taken";
  } catch (e) {}
  return "unknown";
}

async function check(domain){
  const d = await doh(domain);
  if (d === "taken") return { state: "taken" };
  const r = await rdap(domain);
  if (r === "taken") return { state: "taken" };
  if (r === "free") return { state: "free", sure: true };
  if (d === "free") return { state: "free", sure: false };
  return { state: "unknown" };
}

function row(label, tld){
  const domain = label + "." + tld;
  const li = document.createElement("li");
  li.innerHTML = '<span class="name"></span><span class="pill wait">Checking</span><span class="acts"></span>';
  const n = li.querySelector(".name");
  n.append(label); const b = document.createElement("b"); b.textContent = "." + tld; n.append(b);
  results.appendChild(li);
  return { li, domain };
}

function finish(item, res){
  const pill = item.li.querySelector(".pill"), acts = item.li.querySelector(".acts");
  if (res.state === "free") {
    pill.className = "pill ok"; pill.textContent = res.sure ? "Available" : "Likely available";
    const c = document.createElement("button"); c.type = "button"; c.textContent = "Copy";
    c.onclick = async () => { try { await navigator.clipboard.writeText(item.domain); c.textContent = "Copied"; } catch (e) { c.textContent = "Copy failed"; } setTimeout(() => c.textContent = "Copy", 1500); };
    acts.append(c);
  } else if (res.state === "taken") {
    pill.className = "pill no"; pill.textContent = "Taken"; item.li.classList.add("taken");
    const a = document.createElement("a"); a.href = "https://" + item.domain; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Visit";
    acts.append(a);
  } else {
    pill.className = "pill wait"; pill.textContent = "Could not check";
  }
  const w = document.createElement("a"); w.href = "https://who.is/whois/" + item.domain; w.target = "_blank"; w.rel = "noopener"; w.textContent = "WHOIS";
  acts.append(w);
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const { label, typed } = parse($("q").value);
  results.innerHTML = "";
  if (!label) { summary.textContent = "Enter a name using letters, numbers or hyphens."; return; }
  const tlds = [...new Set([...(typed ? [typed] : []), ...TLDS.filter(t => selected.has(t))])];
  if (!tlds.length) { summary.textContent = "Pick at least one extension."; return; }

  const labels = [label];
  if ($("vars").checked) { PREFIX.forEach(p => labels.push(p + label)); SUFFIX.forEach(s => labels.push(label + s)); }

  const my = ++runId, items = [];
  labels.forEach(l => tlds.forEach(t => items.push(row(l, t))));
  $("go").disabled = true;
  let done = 0, free = 0, failed = 0;
  const tick = () => summary.textContent = done < items.length
    ? "Checked " + done + " of " + items.length + "..."
    : free + " available out of " + items.length + (failed ? ". " + failed + " could not be checked. Check your connection and try again." : ".");
  tick();

  let i = 0;
  const worker = async () => {
    while (i < items.length && my === runId) {
      const item = items[i++];
      const res = await check(item.domain);
      if (my !== runId) return;
      finish(item, res); done++;
      if (res.state === "free") free++; if (res.state === "unknown") failed++;
      applyFilter(); tick();
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  if (my === runId) $("go").disabled = false;
});
</script>
</body>
</html>
